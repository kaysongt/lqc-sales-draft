<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Latin Quarter Collective</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3ecdf; color: #141210; font-family: Georgia, serif; }
    main { padding: 2rem; max-width: 28rem; }
    a { color: #141210; }
  </style>
</head>
<body>
  <main>
    <p>Latin Quarter Collective</p>
    <p><a id="home" href="./">Back to the draft</a></p>
  </main>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var root = parts.length ? "/" + parts[0] + "/" : "/";
      var link = document.getElementById("home");
      if (link) link.href = root;
    })();
  </script>
</body>
</html>
